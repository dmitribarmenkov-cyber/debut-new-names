<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1110">
  <title>ДЕБЮТ° — каталог новых имён</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1110;
      --panel: #171a18;
      --panel-2: #1e2220;
      --panel-3: #242925;
      --line: #2a2f2c;
      --line-soft: rgba(255,255,255,.065);
      --text: #edf0ea;
      --muted: #919991;
      --muted-2: #687169;
      --lime: #b6f34a;
      --lime-ink: #19210d;
      --yellow: #ffcc00;
      --blue: #4c75a3;
      --red: #ff7474;
      --radius: 18px;
      --shadow: 0 18px 56px rgba(0,0,0,.24);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 74% -18%, rgba(182,243,74,.075), transparent 38%),
        radial-gradient(ellipse at 0% 48%, rgba(90,116,87,.07), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 3px;
    }
    a { color: inherit; text-decoration: none; }
    .app-frame { min-height: 100vh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(255,255,255,.065);
      background: rgba(15,17,16,.88);
      backdrop-filter: blur(18px);
    }
    .topbar-inner {
      max-width: 1500px;
      min-height: 78px;
      padding: 12px 30px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(205px,1fr) auto minmax(205px,1fr);
      gap: 24px;
      align-items: center;
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; width: max-content; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 13px;
      display: grid; place-items: center;
      background: var(--lime); color: var(--lime-ink);
      font-weight: 950; font-size: 15px; letter-spacing: -.08em;
      box-shadow: 0 0 28px rgba(182,243,74,.18);
    }
    .brand-word { font-weight: 900; font-size: 17px; letter-spacing: .035em; line-height: 1.1; }
    .brand-caption { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; letter-spacing: .095em; text-transform: uppercase; }
    .role-switch {
      justify-self: center;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px; border: 1px solid var(--line); border-radius: 14px;
      background: #141715;
    }
    .role-tab {
      border: 0; border-radius: 10px; padding: 9px 16px;
      background: transparent; color: var(--muted); cursor: pointer;
      font-size: 12px; font-weight: 750; transition: .18s ease;
      white-space: nowrap;
    }
    .role-tab:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .role-tab.active { color: var(--lime-ink); background: var(--lime); box-shadow: 0 5px 18px rgba(182,243,74,.12); }
    .topbar-right { justify-self: end; position: relative; }
    .profile-button {
      display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px;
      border: 1px solid var(--line); border-radius: 14px; background: #171a18;
      text-align: left; cursor: pointer; transition: border-color .18s ease, background .18s ease;
    }
    .profile-button:hover { border-color: #515a50; background: #1b201c; }
    .profile-button-copy { min-width: 84px; }
    .profile-button-name { display: block; font-size: 12px; font-weight: 760; }
    .profile-button-sub { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .chevron { color: var(--muted); font-size: 11px; margin-left: 2px; }
    .profile-menu {
      position: absolute; right: 0; top: calc(100% + 9px); width: 220px; z-index: 50;
      padding: 7px; border: 1px solid var(--line); border-radius: 15px;
      background: #1b201d; box-shadow: var(--shadow);
    }
    .profile-menu button { width: 100%; border: 0; border-radius: 9px; padding: 10px; background: transparent; color: var(--text); text-align: left; font-size: 12px; cursor: pointer; }
    .profile-menu button:hover { background: rgba(255,255,255,.06); }
    .profile-menu .menu-note { padding: 8px 10px 5px; color: var(--muted); font-size: 10px; }

    .shell {
      max-width: 1500px; margin: 0 auto; padding: 27px 30px 58px;
      display: grid; grid-template-columns: 218px minmax(0,1fr); gap: 28px; align-items: start;
    }
    .sidebar { position: sticky; top: 101px; min-width: 0; }
    .side-label { padding: 6px 12px 10px; color: #727b73; font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .side-nav { display: grid; gap: 4px; }
    .side-link {
      width: 100%; display: flex; align-items: center; gap: 11px;
      padding: 10px 12px; border: 1px solid transparent; border-radius: 12px;
      background: transparent; color: #a5ada5; text-align: left; cursor: pointer;
      font-size: 12px; font-weight: 640; transition: .17s ease;
    }
    .side-link:hover { background: rgba(255,255,255,.045); color: var(--text); }
    .side-link.current { color: var(--lime); background: rgba(182,243,74,.08); border-color: rgba(182,243,74,.12); }
    .side-icon { width: 19px; text-align: center; font-size: 15px; }
    .side-count { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 99px; background: #292e2a; color: #b1b9b0; text-align: center; font-size: 10px; }
    .sidebar-card {
      margin-top: 26px; padding: 15px; overflow: hidden; position: relative;
      border: 1px solid var(--line); border-radius: 16px;
      background: linear-gradient(145deg, rgba(182,243,74,.08), rgba(30,34,32,.92) 62%);
    }
    .sidebar-card::after { content: ""; position: absolute; width: 95px; height: 95px; right: -38px; top: -36px; border: 1px solid rgba(182,243,74,.12); border-radius: 50%; box-shadow: 0 0 0 15px rgba(182,243,74,.025), 0 0 0 30px rgba(182,243,74,.018); }
    .sidebar-card-icon { font-size: 20px; margin-bottom: 12px; }
    .sidebar-card strong { display: block; font-size: 12px; }
    .sidebar-card p { color: var(--muted); font-size: 10px; line-height: 1.6; margin: 5px 0 12px; max-width: 160px; }
    .local-status { display: inline-flex; align-items: center; gap: 6px; color: #b7c1b7; font-size: 9px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 9px rgba(182,243,74,.55); }
    .main-content { min-width: 0; }
    .page-intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin: 0 0 23px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 9px; color: var(--lime); font-size: 9px; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
    .eyebrow .eyebrow-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--lime); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 7px; font-size: clamp(27px,3vw,38px); line-height: 1.12; letter-spacing: -.045em; font-weight: 830; }
    h1 .accent { color: var(--lime); }
    .page-intro p { max-width: 650px; margin-bottom: 0; color: var(--muted); font-size: 13px; }
    .intro-chip { align-self: center; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 99px; color: #b8c0b7; background: rgba(23,26,24,.8); font-size: 10px; white-space: nowrap; }
    .intro-chip b { color: var(--lime); font-weight: 750; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(23,26,24,.92); box-shadow: var(--shadow); }
    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 0 0 15px; }
    .section-heading h2 { margin: 0; font-size: 19px; letter-spacing: -.03em; line-height: 1.2; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .section-kicker { display: block; margin-bottom: 5px; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .subtle-count { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .muted { color: var(--muted); }
    .small { font-size: 11px; }

    /* Avatar and cover placeholders: gradients only, no external images. */
    .avatar { flex: 0 0 auto; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(145deg,#d6fc91,#4a6f38); color: #1b2711; font-weight: 900; letter-spacing: -.04em; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
    .avatar.small-avatar { width: 32px; height: 32px; border-radius: 11px; font-size: 10px; }
    .avatar.large-avatar { width: 78px; height: 78px; border-radius: 24px; font-size: 21px; }
    .avatar.avatar-violet { background: linear-gradient(145deg,#e1bcff,#7653a5); color: #241735; }
    .avatar.avatar-blue { background: linear-gradient(145deg,#aae7ef,#397c8a); color: #14343a; }
    .avatar.avatar-amber { background: linear-gradient(145deg,#ffe2a2,#ae653b); color: #3c2412; }
    .avatar.avatar-rose { background: linear-gradient(145deg,#ffd2db,#aa5770); color: #401e2c; }
    .cover { position: relative; display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; border-radius: 15px; isolation: isolate; background: linear-gradient(135deg,#b6f34a,#41622e); color: rgba(14,21,12,.86); }
    .cover::before { content: ""; position: absolute; z-index: -1; width: 78%; aspect-ratio: 1; left: -20%; top: -33%; border: 1px solid rgba(255,255,255,.22); border-radius: 50%; box-shadow: 0 0 0 13px rgba(255,255,255,.07), 0 0 0 28px rgba(255,255,255,.045); }
    .cover::after { content: ""; position: absolute; z-index: -1; width: 64%; aspect-ratio: 1; right: -23%; bottom: -47%; border-radius: 50%; background: rgba(15,17,16,.18); }
    .cover--violet { background: linear-gradient(145deg,#dfb6ff,#6453a5); color: #251637; }
    .cover--blue { background: linear-gradient(145deg,#b0eff4,#398392); color: #12363a; }
    .cover--amber { background: linear-gradient(145deg,#ffe5a0,#ba753d); color: #432713; }
    .cover--rose { background: linear-gradient(145deg,#ffd0d7,#b15d76); color: #451f2e; }
    .cover--mint { background: linear-gradient(145deg,#b6f5d4,#449279); color: #163b2d; }
    .cover-mark { font-size: 31px; font-weight: 950; letter-spacing: -.08em; opacity: .85; }
    .cover-emoji { position: absolute; right: 12px; bottom: 7px; font-size: 19px; opacity: .88; }
    .cover-small { width: 61px; height: 61px; border-radius: 14px; }
    .cover-small .cover-mark { font-size: 22px; }
    .cover-card { width: 100%; aspect-ratio: 1.35/1; border-radius: 16px; }
    .cover-card .cover-mark { font-size: clamp(38px,5vw,61px); }
    .cover-card .cover-emoji { right: 17px; bottom: 10px; font-size: 23px; }

    /* Artist workspace */
    .artist-top-grid { display: grid; grid-template-columns: minmax(0,1.7fr) minmax(280px,.85fr); gap: 15px; margin-bottom: 17px; }
    .profile-card { min-height: 220px; padding: 22px; position: relative; overflow: hidden; background: linear-gradient(130deg,rgba(182,243,74,.055),rgba(23,26,24,.97) 43%); }
    .profile-card::after { content: ""; position: absolute; right: -75px; top: -112px; width: 260px; height: 260px; border: 1px solid rgba(182,243,74,.11); border-radius: 50%; box-shadow: 0 0 0 22px rgba(182,243,74,.025), 0 0 0 48px rgba(182,243,74,.018); pointer-events: none; }
    .profile-main { display: flex; align-items: flex-start; gap: 17px; position: relative; z-index: 1; }
    .profile-copy { min-width: 0; flex: 1; }
    .profile-title-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .profile-title-line h2 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
    .profile-tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 7px; color: #c9d0c7; background: rgba(255,255,255,.065); font-size: 9px; }
    .profile-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; color: #b4bcb3; font-size: 11px; }
    .profile-bio { max-width: 460px; margin: 13px 0 0; color: #a4aca3; font-size: 12px; }
    .profile-actions { position: absolute; right: 20px; bottom: 18px; z-index: 2; display: flex; align-items: center; gap: 13px; }
    .visibility-control { display: flex; align-items: center; gap: 8px; color: #aab2a9; font-size: 10px; }
    .switch { width: 35px; height: 20px; position: relative; padding: 0; border: 1px solid #414941; border-radius: 99px; background: #2a302b; cursor: pointer; transition: .2s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #858e85; transition: .2s; }
    .switch.on { border-color: rgba(182,243,74,.56); background: rgba(182,243,74,.3); }
    .switch.on::after { left: 18px; background: var(--lime); box-shadow: 0 0 9px rgba(182,243,74,.4); }
    .button, .button-secondary, .button-quiet, .button-danger {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 36px; padding: 8px 12px; border: 1px solid transparent; border-radius: 10px;
      cursor: pointer; font-size: 11px; font-weight: 760; transition: .18s ease;
    }
    .button { background: var(--lime); color: #1a220e; box-shadow: 0 5px 16px rgba(182,243,74,.1); }
    .button:hover { background: #c7ff61; transform: translateY(-1px); }
    .button-secondary { border-color: #384039; background: #222723; color: #dfe5dd; }
    .button-secondary:hover { border-color: #626e60; background: #282e29; }
    .button-quiet { border-color: transparent; background: transparent; color: #abb3aa; }
    .button-quiet:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .button-danger { border-color: rgba(255,116,116,.22); color: #ffaaaa; background: rgba(255,116,116,.08); }
    .button-danger:hover { background: rgba(255,116,116,.15); }
    .request-card { padding: 19px; position: relative; overflow: hidden; background: linear-gradient(145deg,#20261e,#191d1a 68%); }
    .request-card::after { content: "✳"; position: absolute; right: 13px; top: 9px; color: rgba(182,243,74,.10); font-size: 77px; line-height: 1; transform: rotate(-12deg); }
    .request-pill { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 7px; background: rgba(182,243,74,.1); color: var(--lime); font-size: 9px; font-weight: 800; }
    .request-card h2 { position: relative; z-index: 1; margin: 13px 0 5px; font-size: 16px; letter-spacing: -.025em; }
    .request-card p { position: relative; z-index: 1; margin: 0 0 12px; color: #a4aca3; font-size: 11px; }
    .request-from { color: var(--text); font-weight: 730; }
    .request-quote { position: relative; z-index: 1; margin: 0 0 14px; padding-left: 10px; border-left: 2px solid rgba(182,243,74,.38); color: #869187; font-size: 10px; }
    .request-card .button { position: relative; z-index: 1; min-height: 32px; }
    .artist-metrics { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 21px; }
    .metric-card { padding: 12px 14px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 14px; background: rgba(23,26,24,.75); }
    .metric-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; background: #222823; font-size: 14px; }
    .metric-number { display: block; font-size: 15px; font-weight: 800; line-height: 1.15; }
    .metric-label { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    .artist-workspace-grid { display: grid; grid-template-columns: minmax(310px,.85fr) minmax(0,1.15fr); gap: 15px; align-items: start; }
    .form-card, .tracks-card { padding: 19px; }
    .form-card .section-heading { margin-bottom: 17px; }
    .form-note { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 9px; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px 10px; }
    .field { min-width: 0; display: block; }
    .field.full { grid-column: 1/-1; }
    .field label, .field-label { display: block; margin: 0 0 6px; color: #c0c7bf; font-size: 10px; font-weight: 700; }
    .optional { color: #727b72; font-weight: 500; }
    .input, .select, .textarea {
      width: 100%; min-width: 0; border: 1px solid #323a34; border-radius: 10px;
      background: #111412; color: var(--text); padding: 10px 11px; font-size: 11px;
      transition: border-color .16s, box-shadow .16s;
    }
    .input::placeholder, .textarea::placeholder { color: #647066; }
    .input:hover, .select:hover, .textarea:hover { border-color: #49534a; }
    .select { padding-right: 28px; cursor: pointer; }
    .textarea { resize: vertical; min-height: 92px; line-height: 1.55; }
    .field-error { display: block; min-height: 0; margin-top: 4px; color: #ff9999; font-size: 9px; }
    .field.has-error .input, .field.has-error .select { border-color: rgba(255,116,116,.75); }
    .form-actions { display: flex; gap: 8px; margin-top: 15px; }
    .form-actions .button { flex: 1; }
    .form-actions .button-secondary { flex: 0 0 auto; }
    .platform-hint { grid-column: 1/-1; margin: -2px 0 0; color: #737d74; font-size: 9px; }
    .track-list { display: grid; gap: 9px; }
    .track-row { display: grid; grid-template-columns: 61px minmax(0,1fr); gap: 11px; padding: 11px; border: 1px solid #2b312d; border-radius: 14px; background: #1a1e1b; }
    .track-row-main { min-width: 0; }
    .track-row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .track-row h3 { margin: 0; overflow: hidden; color: #edf0ea; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; letter-spacing: -.01em; }
    .track-meta { margin-top: 3px; color: var(--muted); font-size: 9px; }
    .track-status { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; padding: 4px 7px; border-radius: 7px; font-size: 8px; font-weight: 800; white-space: nowrap; }
    .track-status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status-published { color: var(--lime); background: rgba(182,243,74,.09); }
    .status-pending { color: #ffd46d; background: rgba(255,204,0,.09); }
    .track-row-bottom { display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-top: 10px; }
    .track-row-actions { display: flex; align-items: center; gap: 2px; }
    .icon-button { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #8d978e; cursor: pointer; font-size: 14px; }
    .icon-button:hover { border-color: #384039; background: #252b26; color: var(--text); }
    .icon-button.danger:hover { border-color: rgba(255,116,116,.25); color: #ff9e9e; background: rgba(255,116,116,.08); }
    .platform-links { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .platform-button {
      min-height: 27px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 5px 8px; border: 1px solid transparent; border-radius: 8px;
      font-size: 9px; font-weight: 820; white-space: nowrap; transition: .16s ease;
    }
    .platform-button.yandex { background: var(--yellow); color: #28220b; }
    .platform-button.yandex:hover { background: #ffda3d; transform: translateY(-1px); }
    .platform-button.vk { background: var(--blue); color: #fff; }
    .platform-button.vk:hover { background: #5c86b5; transform: translateY(-1px); }
    .platform-button.disabled { background: #292e2b; border-color: #383e39; color: #747d75; cursor: not-allowed; font-weight: 700; }
    .platform-button.disabled small { font-size: 8px; font-weight: 500; color: #69736a; }
    .platform-button.compact { min-height: 25px; padding: 4px 7px; font-size: 8px; }
    .empty-state { padding: 25px 15px; border: 1px dashed #353c36; border-radius: 13px; color: var(--muted); text-align: center; font-size: 11px; }
    .empty-state .empty-icon { display: block; margin-bottom: 8px; font-size: 22px; }

    /* Label scouting workspace */
    .filter-card { padding: 17px; margin-bottom: 17px; }
    .filter-card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .filter-card-top strong { font-size: 12px; }
    .filter-card-top span { color: var(--muted); font-size: 10px; }
    .filter-grid { display: grid; grid-template-columns: minmax(190px,1.6fr) repeat(3,minmax(120px,.78fr)) auto; gap: 8px; align-items: end; }
    .filter-grid .field label { font-size: 9px; }
    .filter-grid .input, .filter-grid .select { min-height: 38px; }
    .filter-grid .button { min-height: 38px; white-space: nowrap; }
    .saved-searches { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .saved-search-label { color: var(--muted); font-size: 9px; margin-right: 2px; }
    .search-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid #363e37; border-radius: 99px; background: #202521; color: #bdc5bc; cursor: pointer; font-size: 9px; }
    .search-chip:hover { border-color: rgba(182,243,74,.45); color: var(--lime); }
    .label-layout { display: grid; grid-template-columns: minmax(0,1.65fr) minmax(250px,.72fr); gap: 15px; align-items: start; }
    .results-column { min-width: 0; }
    .artist-results { display: grid; gap: 11px; }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }
    function initials(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return 'Д°';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();

    }
    function titleCase(value) { return String(value || '').trim(); }
    function formatDate(value) {

          <div class="field search-field"><label for="label-query">Имя, жанр или город</label><input class="input" id="label-query" name="q" placeholder="Например, Казань или инди" value="${esc(filters.q)}"></div>

          <div class="field"><label for="label-mood">Настроение</label><select class="select" id="label-mood" name="mood"><option value="">Любое</option>${MOODS.map(m => `<option value="${esc(m)}" ${filters.mood === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
          <button class="button-secondary" type="button" data-action="save-search">＋ Сохранить поиск</button>
        </div>${savedHtml || `<div class="saved-searches"><span class="saved-search-label">Совет:</span><span class="small muted">Сохрани сочетание фильтров, чтобы быстро вернуться к нему.</span></div>`}</section>
        <div class="label-layout"><section class="results-column"><div class="section-heading"><div><span class="section-kicker">Подборка для скаутинга</span><h2>Найденные артисты</h2></div><span class="subtle-count" id="results-count"></span></div><div class="artist-results" id="label-results"></div></section>
          <aside class="label-rail"><section class="card rail-card" id="private-playlist"><div class="rail-title"><h3>▣ &nbsp;Приватный плейлист</h3><span class="count">${state.playlist.length} трек.</span></div>${renderPrivatePlaylist()}</section>
            <section class="card rail-card" id="label-notes"><div class="rail-title"><h3>✎ &nbsp;Личные заметки</h3><span class="notes-save-label">Сохраняются локально</span></div><textarea class="textarea label-note-area" id="label-notes-input" placeholder="Запиши детали: что зацепило, о чём спросить, какие планы у артиста…">${esc(state.notes)}</textarea><div class="small muted" style="margin-top:8px">Заметки видны только в этом демо-браузере.</div></section>
            <section class="card rail-card"><div class="rail-title"><h3>Аккаунт лейбла</h3></div><div class="label-account">${avatarHtml('Иван Петров','mint','small')}<div class="label-account-copy"><strong>Иван Петров</strong><small>Green Sound Records</small></div></div><div class="verified-account">✓ Представитель подтверждён</div></section>

    function renderArtistCard(artist) {
      const favoriteKey = `artist:${artist.id}`;
      const trackHtml = artist.tracks.length ? artist.tracks.map(track => `<div class="artist-track-line"><div class="artist-track-name"><strong>${esc(track.title)}</strong><small>${esc(track.genre)} · ${esc(formatDate(track.date))}</small></div>${platformLinks(track, true, false)}<button class="playlist-add ${state.playlist.includes(track.id) ? 'added' : ''}" type="button" data-action="playlist-add" data-track-id="${esc(track.id)}" title="${state.playlist.includes(track.id) ? 'Уже в плейлисте' : 'Добавить в плейлист'}" aria-label="Добавить ${esc(track.title)} в плейлист">${state.playlist.includes(track.id) ? '✓' : '＋'}</button></div>`).join('') : `<div class="empty-state">У артиста пока нет опубликованных треков.</div>`;

      const all = allCatalogTracks(false).filter(track => track.artistId !== 'artist-lika' || state.profile.visible);

      const filtered = ui.selectedCity === 'all' ? all : all.filter(track => track.artistCity === ui.selectedCity);

        <section class="editorial-banner"><div class="editorial-banner-copy"><div class="eyebrow"><i class="eyebrow-dot"></i> Новая сцена начинается здесь</div><h2>У каждого большого имени был первый релиз.</h2><p>ДЕБЮТ° — витрина и карта связей для тех, кто только начинает. Мы не храним музыку: только показываем, куда идти дальше.</p></div><div class="banner-note"><strong>Как это работает</strong>Выбирай трек, открывай внешнюю площадку и поддерживай новых артистов своим вниманием.</div></section>
        <section class="weekly-section" id="weekly"><div class="section-heading"><div><span class="section-kicker">Выбор редакции</span><h2>Новые имена недели</h2></div><span class="subtle-count">${weekly.length} релиза · редакция</span></div><div class="weekly-grid">${weekly.map(track => `<article class="weekly-card">${coverHtml(track)}<div class="weekly-card-copy"><span class="editor-pick">✦ Редакция</span><strong>${esc(track.title)}</strong><small>${esc(track.artistName)} · ${esc(track.artistCity)}</small></div></article>`).join('')}</div></section>
        <section class="city-filter" id="cities"><span class="city-filter-label">⌖ Найти по городам</span>${[['Москва','Москва'],['Санкт-Петербург','Санкт-Петербург'],['Казань','Казань'],['Екатеринбург','Екатеринбург'],['all','Показать все']].map(([value,label]) => `<button type="button" class="city-chip ${ui.selectedCity === value ? 'active' : ''}" data-action="city-filter" data-city="${esc(value)}">${esc(label)}</button>`).join('')}</section>
        <section id="discovery-feed"><div class="feed-header"><div><h2>Открой новые имена</h2><p>${ui.selectedCity === 'all' ? 'Свежие релизы из независимой сцены' : `Подборка из города «${esc(ui.selectedCity)}»`}</p></div><span class="subtle-count">${filtered.length} ${filtered.length === 1 ? 'трек' : 'треков'}</span></div><div class="track-grid" id="listener-feed">${filtered.length ? filtered.map(renderDiscoveryCard).join('') : `<div class="empty-state" style="grid-column:1/-1"><span class="empty-icon">⌖</span>Пока нет релизов из этого города.<br>Выбери другой город или покажи все.</div>`}</div></section>
        <section class="favorites-section" id="favorites"><div class="favorites-heading"><div><span class="section-kicker">Сохранённое</span><h2>Избранное</h2></div><span class="subtle-count">${favoriteTracks.length} ${favoriteTracks.length === 1 ? 'трек' : 'треков'}</span></div><div class="favorites-grid">${favoriteTracks.length ? favoriteTracks.map(renderFavoriteRow).join('') : `<div class="empty-state" style="grid-column:1/-1;padding:17px"><span class="empty-icon">♡</span>Нажми на сердечко у понравившегося релиза — он появится здесь.</div>`}</div></section>`;
    }
    function renderDiscoveryCard(track) {
      const key = `track:${track.id}`;
      return `<article class="discovery-card"><div class="discovery-card-art">${coverHtml(track, 'cover-card')}<button class="favorite-button ${isFavorite(key) ? 'is-favorite' : ''}" type="button" data-action="favorite-track" data-track-id="${esc(track.id)}" title="${isFavorite(key) ? 'Убрать из избранного' : 'В избранное'}" aria-label="${isFavorite(key) ? 'Убрать из избранного' : 'Добавить в избранное'}">${isFavorite(key) ? '♥' : '♡'}</button></div><div class="discovery-card-copy"><h3>${esc(track.title)}</h3><div class="discovery-artist"><span class="artist-mini-avatar">${esc(track.artistInitials || initials(track.artistName))}</span>${esc(track.artistName)}</div><div class="discovery-tags"><span class="soft-tag">${esc(track.genre)}</span><span class="soft-tag">⌖ ${esc(track.artistCity)}</span></div>${platformLinks(track, false, true)}</div></article>`;
    }
    function renderFavoriteRow(track) {
      return `<div class="favorite-row">${coverHtml(track)}<div class="favorite-row-copy"><strong>${esc(track.title)}</strong><small>${esc(track.artistName)} · ${esc(track.artistCity)}</small></div><button class="icon-button" type="button" data-action="favorite-track" data-track-id="${esc(track.id)}" title="Убрать из избранного">♥</button></div>`;
    }

    function openModal(type, data = {}) {
      ui.modal = { type, ...data };
      ui.profileMenuOpen = false;
      renderHeaderOnly();
      renderModal();
    }
    function renderHeaderOnly() {
      const old = document.querySelector('.topbar');
      if (old) old.outerHTML = renderHeader();
    }
    function closeModal() {
      ui.modal = null;
      document.getElementById('modal-root').innerHTML = '';
    }
    function modalFrame(title, subtitle, body, extraClass = '') {
      return `<div class="modal-backdrop" data-modal-backdrop><section class="modal ${extraClass}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="modal-close" type="button" data-action="close-modal" aria-label="Закрыть">×</button></div>${body}</section></div>`;
    }
    function renderModal() {
      const root = document.getElementById('modal-root');
      if (!ui.modal) { root.innerHTML = ''; return; }
      const modal = ui.modal;
      if (modal.type === 'edit-profile') {
        root.innerHTML = modalFrame('Редактировать профиль', 'Обнови публичные данные артиста.', `<div class="modal-body"><form class="modal-form" id="profile-form"><div class="field"><label for="profile-name">Имя артиста</label><input class="input" id="profile-name" name="name" value="${esc(state.profile.name)}" required></div><div class="field"><label for="profile-city">Город</label><input class="input" id="profile-city" name="city" value="${esc(state.profile.city)}" required></div><div class="field"><label for="profile-genre">Основной жанр</label><select class="select" id="profile-genre" name="genre">${GENRES.map(g => `<option ${state.profile.genre === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></div><div class="field"><label for="profile-bio">О себе</label><textarea class="textarea" id="profile-bio" name="bio" maxlength="180">${esc(state.profile.bio)}</textarea></div><div class="modal-form-actions"><button class="button-secondary" type="button" data-action="close-modal">Отмена</button><button class="button" type="submit">Сохранить профиль</button></div></form></div>`);
      } else if (modal.type === 'offer') {
        root.innerHTML = modalFrame('Предложение о сотрудничестве', `Для артиста: ${modal.target || 'новый артист'}.`, `<div class="modal-body"><form class="modal-form" id="offer-form"><div class="field"><label for="offer-sender">Отправитель</label><input class="input" id="offer-sender" name="sender" value="Иван Петров" required></div><div class="field"><label for="offer-label">Лейбл</label><input class="input" id="offer-label" name="label" value="Green Sound Records" required></div><div class="field"><label for="offer-text">Текст предложения</label><textarea class="textarea" id="offer-text" name="text">Привет! Нам близко твоё звучание. Предлагаем обсудить возможное сотрудничество и следующий релиз — будем рады познакомиться.</textarea></div><div class="modal-warning"><span>⚠</span><span>Это не заключает контракт автоматически — условия подтверждают обе стороны.</span></div><div class="modal-form-actions"><button class="button-secondary" type="button" data-action="close-modal">Отмена</button><button class="button" type="submit">Подтвердить отправку</button></div></form></div>`);
      } else if (modal.type === 'chat') {
        const target = modal.target || 'артистом';
        const messages = Array.isArray(state.chatMessages) ? state.chatMessages : clone(DEFAULT_CHAT);
        const messagesHtml = messages.map(message => {
          const mine = (ui.role === 'label' && message.sender === 'label') || (ui.role === 'artist' && message.sender === 'artist');
          return `<div class="chat-message ${mine ? 'mine' : ''}"><span class="chat-who">${esc(message.name || (message.sender === 'label' ? 'Иван Петров' : state.profile.name))}</span><div class="chat-bubble">${esc(message.text)}</div><span class="chat-time">${esc(message.time || '')}</span></div>`;
        }).join('');
        root.innerHTML = modalFrame(`Чат · ${target}`, 'Демо-переписка сохраняется локально.', `<div class="chat-window"><div class="chat-messages" id="chat-messages"><div class="chat-day">сегодня</div>${messagesHtml}</div><form class="chat-composer" id="chat-form"><input class="input" name="message" id="chat-message-input" placeholder="Напиши сообщение…" autocomplete="off" aria-label="Сообщение"><button class="button" type="submit">Отправить</button></form></div>`, 'chat-dialog');
        const list = document.getElementById('chat-messages');
        if (list) list.scrollTop = list.scrollHeight;
      } else if (modal.type === 'issue') {
        root.innerHTML = modalFrame('Сообщить о проблеме', `Трек: ${modal.trackTitle || 'не выбран'}.`, `<div class="modal-body"><form class="modal-form" id="issue-form"><div class="field"><label for="issue-kind">Что случилось?</label><select class="select" id="issue-kind" name="kind"><option>Ссылка не открывается</option><option>Неверная информация о треке</option><option>Проблема с обложкой</option><option>Другое</option></select></div><div class="field"><label for="issue-text">Комментарий <span class="optional">· необязательно</span></label><textarea class="textarea" id="issue-text" name="text" placeholder="Добавь детали, чтобы мы поняли, что проверить."></textarea></div><div class="modal-form-actions"><button class="button-secondary" type="button" data-action="close-modal">Отмена</button><button class="button" type="submit">Отправить сообщение</button></div></form></div>`);
      }
      const firstInput = root.querySelector('input, textarea, select');
      if (firstInput) setTimeout(() => firstInput.focus(), 0);
    }

    function setLabelFiltersFromUI() {
      const q = document.getElementById('label-query');
      const genre = document.getElementById('label-genre');
      const city = document.getElementById('label-city');
      const mood = document.getElementById('label-mood');
      if (!q || !genre || !city || !mood) return;
      ui.labelFilters = { q: q.value, genre: genre.value, city: city.value, mood: mood.value };
    }
    function refreshListenerFeed() {
      // The listener view is cheap to rebuild and keeps filter chips and favorites in sync.
      renderApp();
    }
    function resetDemo() {
      Object.values(STORAGE).forEach(key => { try { localStorage.removeItem(key); } catch (_) {} });
      state.artistTracks = clone(BASE_SELF_TRACKS);
      state.profile = clone(DEFAULT_PROFILE);
      state.favorites = [];
      state.playlist = [];
      state.notes = '';
      state.savedSearches = [];
      state.chatMessages = clone(DEFAULT_CHAT);
      state.offers = [];
      ui.labelFilters = { q: '', genre: '', city: '', mood: '' };
      ui.selectedCity = 'all';
      ui.editingTrackId = null;
      ui.profileMenuOpen = false;
      closeModal();
      renderApp();
      toast('Демо-данные сброшены');
    }

    // Все действия делегированы от document: обработчики переживают перерисовку интерфейса.
    document.addEventListener('click', event => {
      const roleButton = event.target.closest('[data-role]');
      if (roleButton) {
        ui.role = roleButton.dataset.role;
        ui.profileMenuOpen = false;
        ui.modal = null;
        renderApp();
        return;
      }
      const scrollButton = event.target.closest('[data-scroll-to]');
      if (scrollButton) {
        const target = document.getElementById(scrollButton.dataset.scrollTo);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      const actionButton = event.target.closest('[data-action]');
      if (!actionButton) {
        if (ui.profileMenuOpen && !event.target.closest('.topbar-right')) { ui.profileMenuOpen = false; renderHeaderOnly(); }
        if (event.target.matches('[data-modal-backdrop]')) closeModal();
        return;
      }
      const action = actionButton.dataset.action;
      if (action === 'profile-menu') { ui.profileMenuOpen = !ui.profileMenuOpen; renderHeaderOnly(); return; }
      if (action === 'edit-profile') { openModal('edit-profile'); return; }
      if (action === 'toggle-visibility') {
        state.profile.visible = !state.profile.visible;
        saveStore(STORAGE.profile, state.profile);
        renderApp();
        toast(state.profile.visible ? 'Профиль теперь публичный' : 'Профиль скрыт от каталога');
        return;
      }
      if (action === 'clear-track-form') {
        ui.editingTrackId = null;
        renderApp();
        const form = document.getElementById('track-title'); if (form) form.focus();
        return;
      }
      if (action === 'edit-track') {
        ui.editingTrackId = actionButton.dataset.trackId;
        renderApp();
        const form = document.getElementById('track-form'); if (form) form.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (action === 'report-track') {
        const track = getSelfTracks().find(item => item.id === actionButton.dataset.trackId);
        openModal('issue', { trackTitle: track?.title || '' });
        return;
      }
      if (action === 'open-chat') {
        const artist = getDirectory().find(item => item.id === actionButton.dataset.artistId);
        openModal('chat', { target: actionButton.dataset.target || artist?.name || 'Иван Петров' });
        return;
      }
      if (action === 'open-offer') { openModal('offer', { target: actionButton.dataset.target || 'артисту' }); return; }
      if (action === 'close-modal') { closeModal(); return; }
      if (action === 'favorite-track') {
        const key = `track:${actionButton.dataset.trackId}`;
        toggleFavorite(key);
        renderApp();
        toast(isFavorite(key) ? 'Добавлено в избранное' : 'Убрано из избранного');
        return;
      }
      if (action === 'favorite-artist') {
        const key = `artist:${actionButton.dataset.artistId}`;
        toggleFavorite(key);
        renderApp();
        toast(isFavorite(key) ? 'Артист добавлен в избранное' : 'Артист убран из избранного');
        return;
      }
      if (action === 'playlist-add') {
        const id = actionButton.dataset.trackId;
        if (!state.playlist.includes(id)) {
          state.playlist.push(id); saveStore(STORAGE.playlist, state.playlist); renderApp(); toast('Трек добавлен в приватный плейлист');
        } else toast('Этот трек уже в плейлисте');
        return;
      }
      if (action === 'playlist-remove') {
        state.playlist = state.playlist.filter(id => id !== actionButton.dataset.trackId);
        saveStore(STORAGE.playlist, state.playlist); renderApp(); toast('Трек удалён из плейлиста'); return;
      }
      if (action === 'save-search') {
        setLabelFiltersFromUI();
        const f = ui.labelFilters;
        if (!f.q && !f.genre && !f.city && !f.mood) { toast('Сначала задай хотя бы один фильтр', 'error'); return; }
        const parts = [f.q, f.genre, f.city, f.mood].filter(Boolean);
        const item = { id: `search-${Date.now()}`, name: parts.join(' · '), ...f };
        state.savedSearches = [item, ...state.savedSearches].slice(0, 6);
        saveStore(STORAGE.searches, state.savedSearches);
        renderApp(); toast('Поиск сохранён'); return;
      }
      if (action === 'apply-search') {
        const search = state.savedSearches.find(item => item.id === actionButton.dataset.searchId);
        if (!search) return;
        ui.labelFilters = { q: search.q || '', genre: search.genre || '', city: search.city || '', mood: search.mood || '' };
        renderApp(); return;
      }
      if (action === 'city-filter') {
        ui.selectedCity = actionButton.dataset.city || 'all';
        refreshListenerFeed();
        return;
      }
      if (action === 'reset-demo') {
        ui.profileMenuOpen = false;
        if (window.confirm('Сбросить все локальные демо-данные и вернуться к исходному состоянию?')) resetDemo();
        else renderHeaderOnly();
        return;
      }
    });

    document.addEventListener('input', event => {
      const target = event.target;
      if (target.id === 'label-query') { setLabelFiltersFromUI(); renderLabelResults(); return; }
      if (target.id === 'label-notes-input') {
        state.notes = target.value; saveStore(STORAGE.notes, state.notes); return;
      }
      if (target.id === 'track-yandex' || target.id === 'track-vk' || target.id === 'track-title') {
        const field = target.closest('.field');

      }
    });
    document.addEventListener('change', event => {
      if (['label-genre','label-city','label-mood'].includes(event.target.id)) { setLabelFiltersFromUI(); renderLabelResults(); }
    });

    document.addEventListener('submit', event => {
      const form = event.target;
      if (form.id === 'track-form-element') {
        event.preventDefault();
        const data = new FormData(form);
        const title = titleCase(data.get('title'));
        const genre = String(data.get('genre') || 'Инди-поп');
        const city = titleCase(data.get('city'));
        const date = String(data.get('date') || '');
        const yandex = String(data.get('yandex') || '').trim();
        const vk = String(data.get('vk') || '').trim();
        const color = safeColor(String(data.get('color') || 'lime'));
        const errors = {};
        if (!title) errors.title = 'Укажи название трека.';
        if (!city) errors.city = 'Укажи город.';
        if (yandex && !validPlatformUrl(yandex, 'yandex')) errors.yandex = 'Ссылка должна начинаться с https://music.yandex.ru/';
        if (vk && !validPlatformUrl(vk, 'vk')) errors.vk = 'Ссылка должна начинаться с https://vk.com/';
        form.querySelectorAll('.field').forEach(field => field.classList.remove('has-error'));
        form.querySelectorAll('.field-error').forEach(el => el.textContent = '');
        Object.entries(errors).forEach(([name, message]) => {
          const input = form.querySelector(`[name="${name}"]`);
          const field = input?.closest('.field');
          if (field) { field.classList.add('has-error'); const error = field.querySelector('.field-error'); if (error) error.textContent = message; }
        });
        if (Object.keys(errors).length) { toast(errors.yandex || errors.vk || errors.title || errors.city, 'error'); return; }
        const existingIndex = getSelfTracks().findIndex(track => track.id === ui.editingTrackId);
        if (existingIndex >= 0) {
          state.artistTracks[existingIndex] = { ...state.artistTracks[existingIndex], title, genre, city, date, yandex, vk, color };
          toast('Изменения сохранены');
        } else {
          state.artistTracks.unshift({ id: `track-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, title, genre, city, date, yandex, vk, color, status: 'На модерации', mood: 'Городской' });
          toast('Трек добавлен на модерацию');
        }
        saveStore(STORAGE.tracks, state.artistTracks);
        ui.editingTrackId = null;
        renderApp();
        return;
      }
      if (form.id === 'profile-form') {
        event.preventDefault();
        const data = new FormData(form);
        state.profile = { ...state.profile, name: titleCase(data.get('name')) || DEFAULT_PROFILE.name, city: titleCase(data.get('city')) || DEFAULT_PROFILE.city, genre: String(data.get('genre') || DEFAULT_PROFILE.genre), bio: titleCase(data.get('bio')) };
        saveStore(STORAGE.profile, state.profile);
        closeModal(); renderApp(); toast('Профиль обновлён'); return;
      }
      if (form.id === 'offer-form') {
        event.preventDefault();
        const data = new FormData(form);
        state.offers.unshift({ target: ui.modal?.target || '', sender: String(data.get('sender') || ''), label: String(data.get('label') || ''), text: String(data.get('text') || ''), date: new Date().toISOString() });
        saveStore(STORAGE.offers, state.offers);
        closeModal(); toast('Предложение отправлено'); return;
      }
      if (form.id === 'chat-form') {
        event.preventDefault();
        const input = form.querySelector('[name="message"]');
        const text = String(new FormData(form).get('message') || '').trim();
        if (!text) { toast('Напиши сообщение перед отправкой', 'error'); return; }
        const sender = ui.role === 'label' ? 'label' : 'artist';
        const name = sender === 'label' ? 'Иван Петров' : state.profile.name;
        const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        state.chatMessages.push({ sender, name, text, time });
        saveStore(STORAGE.chat, state.chatMessages);
        renderModal();
        const nextInput = document.getElementById('chat-message-input'); if (nextInput) nextInput.focus();
        return;
      }
      if (form.id === 'issue-form') { event.preventDefault(); closeModal(); toast('Спасибо, сообщение о проблеме отправлено'); return; }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (ui.modal) closeModal();
        if (ui.profileMenuOpen) { ui.profileMenuOpen = false; renderHeaderOnly(); }
      }
    });

    renderApp();
  </script>
